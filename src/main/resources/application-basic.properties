#########################################################################
# BASIC profile: HTTP Basic authentication. The browser shows its own
# username/password dialog; there is no login page.
#
#   mvn -Pbasic
#
# The Maven "basic" profile adds quarkus-elytron-security-properties-file
# and sets quarkus.profile=dev,basic so this file is layered on top of
# application.properties.
#########################################################################
demo.security.mode=basic

# ---------- Users and roles (dev/demo only, plain text!) ----------
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=alice
quarkus.security.users.embedded.roles.alice=admin,user
quarkus.security.users.embedded.users.bob=bob
quarkus.security.users.embedded.roles.bob=user

# ---------- Basic authentication ----------
# Unauthenticated requests to protected pages get a 401 with
# "WWW-Authenticate: Basic realm=...", and the browser asks for credentials.
# The browser then resends the Authorization header itself: no cookie, no session.
# Basic auth sends the password (base64, NOT encrypted) on every request: use HTTPS in production!
quarkus.http.auth.basic=true
quarkus.http.auth.realm=Quarkus Faces

# ---------- Authorization (same rules as the form and oidc profiles) ----------
quarkus.http.auth.permission.secure.paths=/secure/*
quarkus.http.auth.permission.secure.policy=authenticated
quarkus.http.auth.policy.admin-only.roles-allowed=admin
quarkus.http.auth.permission.admin.paths=/secure/admin.xhtml
quarkus.http.auth.permission.admin.policy=admin-only
