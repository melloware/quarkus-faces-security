#########################################################################
# Quarkus Faces Security Demo - BASE configuration (unsecured mode)
#
# This file is always loaded. On its own it runs the app WITHOUT security:
#   mvn quarkus:dev
# Only the public home page is available and a warning banner is shown.
#
# Pick a security mode with a Maven profile, which sets quarkus.profile:
#   mvn -Pbasic   -> dev,basic  -> also loads application-basic.properties
#   mvn -Poidc    -> dev,oidc   -> also loads application-oidc.properties
#########################################################################

# Which security mode is active: none | basic | oidc
# (overridden by the profile files; read by SecurityService)
demo.security.mode=none

# ---------- Faces / HTTP ----------
quarkus.http.port=8080
quarkus.http.enable-compression=true
quarkus.native.resources.includes=META-INF/*.xml,*.properties,*.json
%dev.quarkus.live-reload.instrumentation=true

# ---------- SECURITY: everything OFF by default ----------
# Only quarkus-security is on the classpath here: no embedded users (added by -Pbasic)
# and no quarkus-oidc (added by -Poidc), so there is no way to log in.
# Form login stays off until application-basic.properties turns it on.
quarkus.http.auth.form.enabled=false
