#########################################################################
# FORM profile: a Faces login page (Quarkus form authentication)
# backed by users and roles embedded right here.
#
#   mvn -Pform
#
# The Maven "form" profile adds quarkus-elytron-security-properties-file
# and sets quarkus.profile=dev,form so this file is layered on top of
# application.properties.
#########################################################################
demo.security.mode=form

# ---------- Users and roles (dev/demo only, plain text!) ----------
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=alice
quarkus.security.users.embedded.roles.alice=admin,user
quarkus.security.users.embedded.users.bob=bob
quarkus.security.users.embedded.roles.bob=user

# ---------- Form authentication ----------
# Unauthenticated requests to protected pages redirect to our Faces login page.
# login.xhtml posts j_username / j_password to /j_security_check.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login.xhtml
quarkus.http.auth.form.error-page=/login.xhtml?error=true
quarkus.http.auth.form.landing-page=/secure/user.xhtml
# Server-side logout (FormAuthenticationMechanism.logout) -> cookie can be HttpOnly
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=lax
quarkus.http.auth.form.timeout=PT30M
# Encrypts the credential cookie. DEMO VALUE - use a real secret (env var) in production!
quarkus.http.auth.session.encryption-key=change-me-this-is-a-demo-only-key-1234567890

# ---------- Authorization (same rules as the basic and oidc profiles) ----------
quarkus.http.auth.permission.secure.paths=/secure/*
quarkus.http.auth.permission.secure.policy=authenticated
quarkus.http.auth.policy.admin-only.roles-allowed=admin
quarkus.http.auth.permission.admin.paths=/secure/admin.xhtml
quarkus.http.auth.permission.admin.policy=admin-only
