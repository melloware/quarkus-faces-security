#########################################################################
# OIDC profile: authorization code flow against Keycloak.
#
#   mvn -Poidc        (Docker or Podman must be running)
#
# Quarkus Dev Services starts Keycloak in a container and imports
# quarkus-faces-realm.json, which defines the SAME users and roles as
# the form and basic profiles (alice: admin,user / bob: user).
#########################################################################
demo.security.mode=oidc

# ---------- Keycloak Dev Services ----------
quarkus.keycloak.devservices.enabled=true
quarkus.keycloak.devservices.realm-path=quarkus-faces-realm.json
quarkus.keycloak.devservices.realm-name=quarkus-faces
# In production, point at your real Keycloak instead, e.g.
# quarkus.oidc.auth-server-url=https://sso.example.com/realms/quarkus-faces

# ---------- OIDC web-app (authorization code flow) ----------
quarkus.oidc.enabled=true
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=quarkus-faces
quarkus.oidc.credentials.secret=quarkus-faces-secret
# Keycloak puts realm roles in the ACCESS token (realm_access/roles), not the ID token
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Return to the originally requested page after the Keycloak login
quarkus.oidc.authentication.restore-path-after-redirect=true
# ID + access + refresh tokens are too big for one cookie
quarkus.oidc.token-state-manager.split-tokens=true
# Refresh expired access tokens automatically using the refresh token
quarkus.oidc.token.refresh-expired=true

# ---------- Logout ----------
# Virtual path: nothing in the app implements it. Hitting it (as a logged in
# user) starts RP-initiated logout at Keycloak, then returns to post-logout-path.
quarkus.oidc.logout.path=/secure/logout
quarkus.oidc.logout.post-logout-path=/index.xhtml

# ---------- Authorization (same rules as the form and basic profiles) ----------
quarkus.http.auth.permission.secure.paths=/secure/*
quarkus.http.auth.permission.secure.policy=authenticated
quarkus.http.auth.policy.admin-only.roles-allowed=admin
quarkus.http.auth.permission.admin.paths=/secure/admin.xhtml
quarkus.http.auth.permission.admin.policy=admin-only
